version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: shopstack-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: shopstack
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shopstack"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shopstack-backend
    restart: always
    ports:
      - '5000:5000'
    environment:
      - DATABASE_URL=postgresql://postgres:password123@postgres:5432/shopstack?schema=public
      - JWT_SECRET=supersecretjwtkey123
      - PORT=5000
      - FRONTEND_URL=http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shopstack-frontend
    restart: always
    ports:
      - '3000:3000'
    environment:
      # This tells Next.js client where to fetch data
      - NEXT_PUBLIC_API_URL=http://localhost:5000
      # This tells Next.js SSR server where to fetch data internally
      - INTERNAL_API_URL=http://backend:5000
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_uploads:
